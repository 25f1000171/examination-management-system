{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white fw-bold">
                {{ 'Edit Examination & Timelines' if exam else 'Create New Examination' }}
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Select Course</label>
                            <select name="course_id" class="form-select" required>
                                {% for c in courses %}
                                    <option value="{{ c.id }}" {% if exam and exam.course_id == c.id %}selected{% endif %}>
                                        {{ c.course_code }} - {{ c.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Examination Name</label>
                            <input type="text" name="name" class="form-control" value="{{ exam.name if exam else '' }}" placeholder="e.g., End Term Viva" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Examination Type</label>
                            <select name="exam_type" class="form-select" required>
                                {% for t in ['Viva', 'Practical', 'Project Demo', 'Assessment'] %}
                                    <option value="{{ t }}" {% if exam and exam.exam_type == t %}selected{% endif %}>{{ t }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Duration (Minutes)</label>
                            <input type="number" name="duration" class="form-control" value="{{ exam.duration if exam else 30 }}" min="5" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Maximum Marks</label>
                            <input type="number" name="max_marks" class="form-control" value="{{ exam.max_marks if exam else 100 }}" min="1" required>
                        </div>

                        <hr class="my-3">
                        <h6 class="fw-bold mb-0">Configure Examination Timelines</h6>

                        <div class="col-md-6">
                            <label class="form-label">Slot Creation Start</label>
                            <input type="datetime-local" name="slot_creation_start" class="form-control"
                                value="{{ exam.slot_creation_start.strftime('%Y-%m-%dT%H:%M') if exam else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Slot Creation End</label>
                            <input type="datetime-local" name="slot_creation_end" class="form-control"
                                value="{{ exam.slot_creation_end.strftime('%Y-%m-%dT%H:%M') if exam else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Student Booking Start</label>
                            <input type="datetime-local" name="slot_booking_start" class="form-control"
                                value="{{ exam.slot_booking_start.strftime('%Y-%m-%dT%H:%M') if exam else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Student Booking End</label>
                            <input type="datetime-local" name="slot_booking_end" class="form-control"
                                value="{{ exam.slot_booking_end.strftime('%Y-%m-%dT%H:%M') if exam else '' }}" required>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Current Examination Stage / Status</label>
                            <select name="status" class="form-select">
                                {% for st in ['Draft', 'Slot Creation', 'Booking Open', 'Closed', 'Completed'] %}
                                    <option value="{{ st }}" {% if exam and exam.status == st %}selected{% endif %}>{{ st }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
                        <button type="submit" class="btn btn-success">{{ 'Save Changes' if exam else 'Create Examination' }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
