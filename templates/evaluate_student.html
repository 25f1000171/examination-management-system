{% extends 'base.html' %}
{% block title %}Evaluate Student{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Evaluate Student: {{ booking.student.name }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <h5 class="mb-3">Marking Scheme</h5>
                    
                    {% for rubric in rubrics %}
                    <div class="mb-3 p-3 border rounded bg-light">
                        <label class="form-label fw-bold">{{ rubric.criterion_name }} (Max: {{ rubric.max_marks }})</label>
                        <input type="number" step="0.5" class="form-control" name="rubric_{{ rubric.id }}" min="0" max="{{ rubric.max_marks }}" required placeholder="Enter marks out of {{ rubric.max_marks }}">
                    </div>
                    {% else %}
                    <div class="alert alert-warning">Admin don't have any rubrics set for this exam</div>
                    {% endfor %}

                    <div class="mb-3 mt-4">
                        <label class="form-label fw-bold">Overall Remarks / Feedback</label>
                        <textarea class="form-control" name="remarks" rows="3"></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('manage_slot', id=booking.slot_id) }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success" {% if not rubrics %}disabled{% endif %}>Submit Evaluation</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
