{% extends 'base.html' %}

{% block title %}Create Slot{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-info text-dark">
                <h5 class="mb-0 fw-bold">Create Slot for {{ exam.name }}</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Assign Examiner</label>
                        <select name="examiner_id" class="form-select" required>
                            <option value="">Select Examiner</option>
                            {% for ex in examiners %}
                            <option value="{{ ex.id }}">{{ ex.name }} ({{ ex.username }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Exam Date</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Start Time</label>
                            <input type="time" name="start_time" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">End Time</label>
                            <input type="time" name="end_time" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Seat Capacity</label>
                        <input type="number" name="capacity" class="form-control" min="1" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Create Slot</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
